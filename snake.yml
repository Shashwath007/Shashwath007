name: generate animation

on:
  # runs automatically once a day
  schedule:
    - cron: "0 */24 * * *"
  # lets you trigger it manually from the Actions tab
  workflow_dispatch:
  # runs on every push to main (change to "master" below if that's your default branch)
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # generates the snake from your contribution graph as svg (light + dark) and gif
      - name: generate github-contribution-grid-snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=%23f5b942&color_dots=%23161b22,%232a3a52,%233d6666,%234fd1c5,%23f5b942

      # pushes the generated files to a branch called "output"
      # they become available at https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
