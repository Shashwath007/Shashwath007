name: Update README stats

on:
  # runs automatically once a day
  schedule:
    - cron: "0 3 * * *"
  # lets you trigger it manually from the Actions tab
  workflow_dispatch:
  # runs any time this file itself is edited
  push:
    paths:
      - ".github/workflows/readme-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # main stats card (stars, commits, PRs, issues) — private repos count
      # because STATS_TOKEN has repo + read:user scope, unlike the default
      # GITHUB_TOKEN which can only ever see public data
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      # top languages card — same story, private repos only show up
      # here because of the scoped token, not because of a URL flag
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      # streak stats — this tool only needs a token to exist, no
      # particular scope, but reusing STATS_TOKEN here is simpler
      # than managing two separate secrets
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats" || exit 0
          git push
